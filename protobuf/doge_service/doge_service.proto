syntax = "proto3";
option go_package = "./protobuf/doge_service";

package protobuf;

message DogeCheckUtxoInfoReq {
    repeated string outPoints = 1;
}

message DogeCheckUtxoInfoResp {
    map<string, DogeUtxoInfo> utxoInfos = 1;
}

message DogeUtxoInfo {
    bool isExist = 1;
    bool txConfirm = 2;
    string spendStatus = 3;
    int64 height = 4;
    int64 date = 5;
    int64 value = 6;
    string where = 7;
    string address = 8;
    DogeSpendInfo spendInfo = 9;
}

message DogeSpendInfo {
    string spendTx = 1;
    int64 height = 2;
    int64 date = 3;
    string where = 4;
}

message DogeAddressBalanceReq {
    string address = 1;
    string source = 2;
}

message DogeAddressBalanceResp {
    string address = 1;
    uint64 confirmed = 2;
    int64 unconfirmed = 3;
    int32 utxoCount = 4;
}

message DogeAddressUtxoReq {
    string address = 1;
    string flag = 2;
    string source = 3;
}

message DogeAddressUtxoResp {
    repeated DogeUtxo utxos = 1;
    int64 total = 2;
}

message DogeUtxo {
    string flag = 1;
    string txid = 2;
    int32 outIndex = 3;
    string value = 4;
    int64 height = 5;
    string address = 6;
}

message DogeAddressTxReq {
    string address = 1;
    int64 limit = 2;
    string flag = 3;
    bool confirmed = 4;
    string source = 5;
}

message DogeAddressTxResp {
    repeated DogeAddressTx txs = 1;
    int64 total = 2;
}

message DogeAddressTx {
    string txid = 1;
    int64 time = 2;
    int64 height = 3;
    string address = 4;
    string flag = 5;
    int64 income = 6;
    int64 outcome = 7;
    string genesis = 8;
    string createAt = 9;
}

message DogeAddressTxCountReq {
    string address = 1;
    string source = 2;
}

message DogeAddressTxCountResp {
    int64 txCount = 1;
}

message DogeTxRawReq {
    string txId = 1;
    string source = 2;
}

message DogeTxRawResp {
    string txRaw = 1;
}

message DogeBroadcastTxReq {
    string hex = 1;
    string source = 2;
}

message DogeBroadcastTxResp {
    string txId = 1;
    string message = 2;
}

message DogeFeeRateReq {
}

message DogeFeeRateItem {
    string title = 1;
    string desc = 2;
    int64 feeRate = 3;
}

message DogeFeeRateResp {
    repeated DogeFeeRateItem list = 1;
}

message DogeTxInfoReq {
    string txId = 1;
}

message DogeTxInfoResp {
    uint64 height = 1;
    bool confirmed = 2;
    string txHash = 3;
}

service DogeService {
    rpc CheckUtxoInfo(DogeCheckUtxoInfoReq) returns (DogeCheckUtxoInfoResp) {}
    rpc GetAddressBalance(DogeAddressBalanceReq) returns (DogeAddressBalanceResp);
    rpc GetAddressUtxo(DogeAddressUtxoReq) returns (DogeAddressUtxoResp);
    rpc GetAddressTx(DogeAddressTxReq) returns (DogeAddressTxResp);
    rpc GetAddressTxCount(DogeAddressTxCountReq) returns (DogeAddressTxCountResp);
    rpc GetTxRaw(DogeTxRawReq) returns (DogeTxRawResp);
    rpc BroadcastTx(DogeBroadcastTxReq) returns (DogeBroadcastTxResp);
    rpc GetFeeRate(DogeFeeRateReq) returns (DogeFeeRateResp);
    rpc GetTxInfo(DogeTxInfoReq) returns (DogeTxInfoResp) {}
}
